<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7fc4ec">
  <meta name="description" content="用 Web 3D 探索七种常见云型。">
  <title>云境 · 3D 云图鉴</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237fc4ec'/%3E%3Cpath d='M17 41h31a9 9 0 0 0-2-17.8A15 15 0 0 0 18.2 27 7 7 0 0 0 17 41Z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#17314a;--ink-soft:rgba(23,49,74,.63);--white:rgba(255,255,255,.92);--line:rgba(255,255,255,.72);--serif:"Baskerville","Times New Roman","Songti SC",serif;--mono:"SFMono-Regular","IBM Plex Mono",Consolas,monospace;font-family:var(--mono)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#83c7ed;color:var(--ink);-webkit-user-select:none;user-select:none}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}
    .backdrop{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(.88) brightness(1.04)}
    .wash{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.13),transparent 35%),linear-gradient(0deg,rgba(234,245,250,.23),transparent 42%)}
    #scene{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}#scene:active{cursor:grabbing}
    .masthead{position:fixed;z-index:4;left:50px;top:48px;margin:0;color:var(--white);font:13px/1 var(--mono);letter-spacing:.35em;text-transform:uppercase;text-shadow:0 1px 12px rgba(16,55,83,.18)}
    .cloud-nav{position:fixed;z-index:5;left:50px;top:105px;bottom:40vh;width:218px;display:flex}.rail{position:relative;width:14px;margin-right:20px;border-left:1px solid rgba(255,255,255,.62)}.cloud-list{display:flex;flex:1;flex-direction:column;justify-content:space-between;padding:0}.cloud-btn{position:relative;min-height:42px;border:0;background:transparent;color:rgba(23,49,74,.58);text-align:left;cursor:pointer;padding:2px 8px;transition:.25s ease}.cloud-btn:before{content:"";position:absolute;left:-37px;top:14px;width:6px;height:6px;border-radius:50%;background:rgba(23,49,74,.38);box-shadow:0 0 0 1px rgba(255,255,255,.45)}.cloud-btn:hover{color:var(--ink);transform:translateX(2px)}.cloud-btn.active{color:var(--ink)}.cloud-btn.active:before{left:-40.5px;top:10px;width:13px;height:13px;background:white;box-shadow:0 0 0 3px rgba(255,255,255,.2)}.cloud-en{display:block;font:12px/1.2 var(--serif);letter-spacing:.12em;text-transform:uppercase}.cloud-cn{display:block;margin-top:5px;font:14px/1.2 var(--mono);letter-spacing:.08em}.cloud-btn.active .cloud-en{font-weight:700}.cloud-btn.active .cloud-cn{font-size:16px;font-weight:650}
    .drag-hint{position:fixed;z-index:4;right:7.5%;top:46%;display:flex;align-items:center;gap:11px;color:white;font:14px/1 var(--serif);letter-spacing:.06em;text-shadow:0 1px 8px rgba(15,55,80,.25);pointer-events:none}.drag-hint small{display:block;margin-top:10px;text-align:center;font:18px/1 var(--serif);letter-spacing:.45em}
    .scale{position:fixed;z-index:4;right:28%;bottom:32%;display:flex;align-items:flex-end;gap:8px;color:white;font:13px/1 var(--mono);text-shadow:0 1px 8px rgba(15,55,80,.25);pointer-events:none}.scale-leader{display:block;flex:0 0 auto;overflow:visible}.scale-leader circle{fill:currentColor}.scale-leader path{fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;vector-effect:non-scaling-stroke}.scale span{padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.85)}
    .cloud-info{position:fixed;z-index:4;left:9%;bottom:13%;width:min(650px,55vw);color:var(--ink);text-shadow:0 1px 16px rgba(255,255,255,.25);animation:infoIn .45s ease both;pointer-events:none}@keyframes infoIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.cloud-info h1{margin:0;font:42px/1.05 var(--serif);letter-spacing:.03em}.cloud-info h2{display:inline-block;margin:8px 0 12px;font:30px/1.1 "Songti SC","STSong",var(--serif);font-weight:500;letter-spacing:.12em}.cloud-info h2:after{content:"";display:inline-block;width:54px;height:1px;margin-left:18px;vertical-align:middle;background:currentColor;opacity:.75}.cloud-info p{margin:0;color:rgba(23,49,74,.75);font:14px/1.5 var(--mono);letter-spacing:.08em}.cloud-info .fact{position:absolute;left:0;top:100%;width:min(560px,80vw);margin-top:10px;color:rgba(23,49,74,.82);font:12px/1.7 var(--mono);letter-spacing:.04em}
    .credit{position:fixed;z-index:6;right:44px;bottom:28px;color:rgba(255,255,255,.78);font:11px/1 var(--mono);letter-spacing:.14em;text-decoration:none;text-shadow:0 1px 8px rgba(15,55,80,.25)}.credit:hover{color:white}
    .atmosphere{position:fixed;z-index:6;right:44px;top:43px;width:188px}.atmosphere summary{display:flex;justify-content:flex-end;align-items:center;gap:9px;color:rgba(255,255,255,.88);font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;list-style:none}.atmosphere summary::-webkit-details-marker{display:none}.atmosphere summary:before{content:"";width:5px;height:5px;border-radius:50%;background:white}.atmosphere[open] .atmo-panel{opacity:1;transform:none}.atmo-panel{margin-top:14px;padding:14px;border:1px solid rgba(255,255,255,.55);background:rgba(68,132,174,.26);backdrop-filter:blur(14px);border-radius:2px;color:white;opacity:0;transform:translateY(-5px);transition:.2s}.atmo-panel label{display:block;margin-bottom:13px;font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase}.atmo-panel label:last-child{margin:0}.atmo-panel input{display:block;width:100%;margin-top:8px;accent-color:white}
    .mobile-name{display:none}.webgl-warning{display:none;position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border:1px solid rgba(255,255,255,.7);background:rgba(38,102,145,.72);backdrop-filter:blur(12px);color:white}.webgl-warning.show{display:block}
    @media(max-width:620px){.masthead{left:22px;top:26px;font-size:11px}.credit{right:22px;bottom:62px}.atmosphere{right:20px;top:24px;width:164px}.cloud-nav{left:22px;right:22px;top:auto;bottom:6px;width:auto;height:48px}.rail{display:none}.cloud-list{flex-direction:row;gap:8px;overflow-x:auto;scrollbar-width:none}.cloud-list::-webkit-scrollbar{display:none}.cloud-btn{flex:0 0 auto;min-height:42px;padding:7px 12px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}.cloud-btn:before{display:none}.cloud-btn.active{background:rgba(255,255,255,.74)}.cloud-en{font-size:10px}.cloud-cn{font-size:12px;margin-top:3px}.cloud-btn.active .cloud-cn{font-size:12px}.drag-hint{right:7%;top:44%;font-size:12px}.scale{right:13%;bottom:38%}.cloud-info{left:22px;bottom:105px;width:calc(100% - 44px)}.cloud-info h1{font-size:31px}.cloud-info h2{font-size:22px;margin-top:5px}.cloud-info p{font-size:12px}.cloud-info .fact{margin-top:7px;font-size:11px;line-height:1.55}.wash{background:linear-gradient(0deg,rgba(239,248,251,.35),transparent 50%)}.backdrop{object-position:62% center}}
    @media(max-height:690px) and (min-width:821px){.cloud-nav{bottom:245px}.cloud-info{bottom:7%}}
    @media(prefers-reduced-motion:reduce){.cloud-info{animation:none}}
  </style>
</head>
<body>
  <img class="backdrop" src="cloud-atlas-bg.png" alt="阳光照耀下的高空云海与远山">
  <div class="wash"></div>
  <canvas id="scene" aria-label="可交互的三维云体模型。拖拽旋转视角，滚轮缩放。"></canvas>
  <p class="masthead">Atlas of Clouds</p>
  <nav class="cloud-nav" aria-label="云型选择"><div class="rail"></div><div class="cloud-list" id="cloud-list"></div></nav>
  <div class="drag-hint" aria-hidden="true"><div>Drag to orbit<small>← →</small></div></div>
  <div class="scale" aria-hidden="true"><svg class="scale-leader" viewBox="0 0 42 28" width="42" height="28" aria-hidden="true"><circle cx="4" cy="3.5" r="3"/><path d="M4 3.5 L39 24.5"/></svg><span id="scale-label">1.2 km</span></div>
  <section class="cloud-info" id="cloud-info" aria-live="polite"></section>
  <a class="credit" href="https://www.doooit.me" target="_blank" rel="noopener noreferrer">made by doit</a>
  <details class="atmosphere"><summary>Atmosphere</summary><div class="atmo-panel"><label>Cloud density<input id="density" type="range" min="35" max="100" value="88" aria-label="云量"></label><label>Sunlight<input id="sunlight" type="range" min="18" max="100" value="86" aria-label="日光强度"></label></div></details>
  <div class="webgl-warning" id="warning">当前浏览器无法启用 WebGL 2，请尝试最新版浏览器。</div>
  <script src="cloud-renderer.js"></script>
  <script>
  const CLOUDS=[
    {id:'cirrus',type:0,en:'Cirrus',cn:'卷云',range:'6—13 km',copy:'High, featherlike ice crystals',fact:'由高空冰晶形成，丝状云丝常预示天气系统正在接近。',scale:'8.4 km',accent:'#eef8ff'},
    {id:'altocumulus',type:2,en:'Altocumulus',cn:'高积云',range:'2—7 km',copy:'Mid-level patches and rounded cells',fact:'由中层水滴与冰晶构成；若清晨持续增厚，可能预示午后对流。',scale:'2.6 km',accent:'#e7f3f8'},
    {id:'altostratus',type:3,en:'Altostratus',cn:'高层云',range:'2—7 km',copy:'A broad translucent middle layer',fact:'覆盖范围广，太阳常像隔着毛玻璃；继续增厚时可能转为持续降水。',scale:'3.2 km',accent:'#dcebf1'},
    {id:'nimbostratus',type:4,en:'Nimbostratus',cn:'雨层云',range:'0.3—4 km',copy:'Deep, rain-bearing overcast',fact:'厚实低暗的降水云，常带来数小时连续小到中雨或雪。',scale:'2.4 km',accent:'#c7d6de'},
    {id:'stratocumulus',type:5,en:'Stratocumulus',cn:'层积云',range:'0.6—2 km',copy:'Low, rolling layers',fact:'低空块状云层，常见于稳定空气中，多为阴天但降水通常较弱。',scale:'1.2 km',accent:'#f8fbf9'},
    {id:'cumulus',type:6,en:'Cumulus',cn:'积云',range:'0.5—2 km',copy:'Bright, buoyant fair-weather towers',fact:'受地面加热形成，底部平坦、顶部隆起；小积云通常代表天气晴好。',scale:'1.0 km',accent:'#fff8e8'},
    {id:'cumulonimbus',type:7,en:'Cumulonimbus',cn:'积雨云',range:'0.5—16 km',copy:'Towering convection and thunder',fact:'强对流云可贯穿对流层，可能伴随雷电、短时强降雨、冰雹和阵风。',scale:'12 km',accent:'#f5e8db'}
  ];
  const VIEW_RESET={yaw:-.14,pitch:-.04,zoom:.90};
  let state={active:4,density:.88,sunlight:.86,yaw:VIEW_RESET.yaw,pitch:VIEW_RESET.pitch,zoom:VIEW_RESET.zoom,drag:false,x:0,y:0};
  const list=document.querySelector('#cloud-list'),info=document.querySelector('#cloud-info'),scale=document.querySelector('#scale-label');
  CLOUDS.forEach((c,i)=>{list.insertAdjacentHTML('beforeend',`<button class="cloud-btn" data-cloud="${i}" aria-label="查看${c.cn}"><span class="cloud-en">${c.en}</span><span class="cloud-cn">${c.cn}</span></button>`)});
  function selectCloud(i){state.active=i;state.yaw=VIEW_RESET.yaw;state.pitch=VIEW_RESET.pitch;state.zoom=VIEW_RESET.zoom;const c=CLOUDS[i];document.querySelectorAll('[data-cloud]').forEach(b=>b.classList.toggle('active',+b.dataset.cloud===i));info.style.animation='none';void info.offsetWidth;info.style.animation='';info.innerHTML=`<h1>${c.en.toUpperCase()}</h1><h2>${c.cn}</h2><p>${c.copy} · ${c.range}</p><p class="fact">${c.fact}</p>`;scale.textContent=c.scale}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-cloud]');if(b)selectCloud(+b.dataset.cloud)});selectCloud(state.active);
  document.querySelector('#density').addEventListener('input',e=>state.density=+e.target.value/100);document.querySelector('#sunlight').addEventListener('input',e=>state.sunlight=+e.target.value/100);
  const canvas=document.querySelector('#scene');
  const rendererReady=window.CloudRenderer?.start(canvas,state,()=>CLOUDS[state.active]);
  if(!rendererReady)document.querySelector('#warning').classList.add('show');
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);Object.assign(state,{drag:true,x:e.clientX,y:e.clientY})});
  canvas.addEventListener('pointermove',e=>{if(!state.drag)return;e.preventDefault();state.yaw+=(e.clientX-state.x)*.004;state.pitch=Math.max(-.45,Math.min(.42,state.pitch+(e.clientY-state.y)*.0025));state.x=e.clientX;state.y=e.clientY});
  ['pointerup','pointercancel'].forEach(type=>canvas.addEventListener(type,()=>state.drag=false));
  const ZOOM_MIN=0.38,ZOOM_MAX=1.85;
  canvas.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,state.zoom+e.deltaY*.0008))},{passive:false});
  document.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)e.preventDefault()},{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
  </script>
</body>
</html>
