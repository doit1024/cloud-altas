<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07121c">
  <meta name="description" content="用 Web 3D 探索积雨云、层积云、卷云、积云与层云。">
  <title>云境 · 3D 云图鉴</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2307121c'/%3E%3Cpath d='M17 41h31a9 9 0 0 0-2-17.8A15 15 0 0 0 18.2 27 7 7 0 0 0 17 41Z' fill='%23bfe8f5'/%3E%3Cpath d='M12 46h40' stroke='%23f4b15b' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--ink:#eef7fa;--muted:rgba(238,247,250,.56);--line:rgba(255,255,255,.13);--panel:rgba(8,20,30,.76);--accent:#f4b15b;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#07121c;color:var(--ink)}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}
    #scene{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;background:radial-gradient(circle at 65% 35%,#285875,#07121c 66%)}#scene:active{cursor:grabbing}
    .veil{pointer-events:none;position:fixed;inset:0;background:linear-gradient(90deg,rgba(3,11,18,.86),rgba(3,11,18,.20) 30%,transparent 58%),linear-gradient(0deg,rgba(3,10,17,.76),transparent 34%)}
    header{position:fixed;z-index:4;inset:0 0 auto;height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line);pointer-events:none}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);font-size:20px}.brand h1{font-size:18px;line-height:1.2;margin:0;font-weight:550;letter-spacing:.2em}.brand p{margin:3px 0 0;color:rgba(255,255,255,.47);font:11px/1.2 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.status{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.58);font-size:14px}.dot{width:6px;height:6px;border-radius:50%;background:#8bd5f4;box-shadow:0 0 14px #8bd5f4}
    nav{position:fixed;z-index:4;left:32px;top:112px;width:210px}.eyebrow{margin:0 0 12px;color:rgba(255,255,255,.44);font:12px/1.2 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.cloud-list{display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line);padding-left:16px}.cloud-btn{height:56px;width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:12px;padding:0 13px;background:transparent;color:rgba(255,255,255,.48);cursor:pointer;text-align:left;transition:.2s ease}.cloud-btn:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.04)}.cloud-btn.active{color:white;background:rgba(255,255,255,.09)}.cloud-icon{width:20px;font-size:16px;opacity:.7}.cloud-btn strong{font-weight:500;font-size:15px;flex:1}.cloud-code{font:12px ui-monospace,monospace;opacity:.45}
    .card{position:fixed;z-index:4;right:32px;top:112px;width:min(370px,calc(100% - 40px));padding:28px;border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.28);backdrop-filter:blur(24px);animation:cardIn .45s cubic-bezier(.22,.8,.2,1)}@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px}.latin{margin:0 0 8px;color:rgba(255,255,255,.45);font:12px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.card h2{font-size:48px;font-weight:300;line-height:1.1;letter-spacing:-.03em;margin:0}.code-badge{width:48px;height:48px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:50%;color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);font:14px ui-monospace,monospace}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.fact{border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:15px;background:rgba(255,255,255,.045)}.fact small,.formation-label{display:block;margin-bottom:6px;color:rgba(255,255,255,.42);font-size:12px}.fact span{font-size:14px}.fact:first-child span{font-family:ui-monospace,monospace}.description{margin:0;color:rgba(255,255,255,.72);font-size:15px;line-height:1.85}.divider{height:1px;background:rgba(255,255,255,.1);margin:22px 0}.formation-label{letter-spacing:.15em;text-transform:uppercase}.formation{margin:0;color:rgba(255,255,255,.58);font-size:14px;line-height:1.75}
    .hint{position:fixed;z-index:3;bottom:112px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.35);font:12px ui-monospace,monospace;letter-spacing:.14em;white-space:nowrap}.bottom{position:fixed;z-index:5;left:32px;right:32px;bottom:28px}.mobile-tabs{display:none}.controls{width:min(760px,100%);min-height:64px;margin:auto;display:flex;align-items:center;gap:24px;padding:11px 22px;border:1px solid var(--line);border-radius:22px;background:rgba(8,20,30,.80);box-shadow:0 20px 60px rgba(0,0,0,.3);backdrop-filter:blur(24px)}.drag-label,.toggle-label{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.48);font-size:12px;white-space:nowrap}.bar{height:28px;width:1px;background:rgba(255,255,255,.1)}.control{display:flex;align-items:center;gap:12px;flex:1;min-width:0;color:rgba(255,255,255,.55);font-size:12px;white-space:nowrap}.control input[type=range]{appearance:none;width:100%;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--range) 0 var(--value),rgba(255,255,255,.14) var(--value));outline:none}.control input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border:1px solid rgba(255,255,255,.85);border-radius:50%;background:white;cursor:pointer;box-shadow:0 0 0 4px rgba(255,255,255,0)}.control input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(139,213,244,.35)}.switch{position:relative;width:38px;height:22px;border:0;border-radius:99px;background:rgba(255,255,255,.16);cursor:pointer;transition:.2s}.switch:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:white;transition:.2s}.switch.on{background:#6fb7cf}.switch.on:after{transform:translateX(16px)}
    .webgl-warning{display:none;position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:#0b1822;color:white}.webgl-warning.show{display:block}
    @media(max-width:800px){header{height:76px;padding:0 20px}.status,nav,.hint{display:none}.card{top:92px;right:20px;padding:22px;max-height:calc(100dvh - 248px);overflow:auto}.card h2{font-size:38px}.bottom{left:20px;right:20px;bottom:20px}.mobile-tabs{display:flex;gap:5px;overflow:auto;scrollbar-width:none;margin-bottom:10px;padding:4px;border:1px solid var(--line);border-radius:16px;background:rgba(8,20,30,.8);backdrop-filter:blur(20px)}.mobile-tabs::-webkit-scrollbar{display:none}.mobile-tabs button{flex:none;height:40px;border:0;border-radius:12px;padding:0 15px;background:transparent;color:rgba(255,255,255,.56);white-space:nowrap}.mobile-tabs button.active{background:rgba(255,255,255,.12);color:white}.controls{min-height:56px;gap:14px;padding:10px 14px}.drag-label,.sun-control,.controls>.bar{display:none}.toggle-label span{display:none}}
    @media(max-width:440px){.card{left:20px;width:auto}.card-head{margin-bottom:20px}.facts{margin-bottom:18px}.description{line-height:1.65}.divider{margin:17px 0}}
    @media(prefers-reduced-motion:reduce){.card{animation:none}}
  </style>
</head>
<body>
  <canvas id="scene" aria-label="可交互的三维云体模型。拖拽旋转视角，滚轮缩放。"></canvas>
  <div class="veil"></div>
  <header><div class="brand"><div class="brandmark">☁</div><div><h1>云境</h1><p>Cloud Atlas · 3D</p></div></div><div class="status"><span class="dot"></span>实时体积渲染</div></header>
  <nav><p class="eyebrow">常见云型 · 05</p><div class="cloud-list" id="cloud-list"></div></nav>
  <article class="card" id="card" aria-live="polite"></article>
  <p class="hint">滚轮缩放 · 拖拽旋转 · 选择云型</p>
  <div class="bottom"><div class="mobile-tabs" id="mobile-tabs"></div><div class="controls">
    <div class="drag-label">◎ 拖拽观察</div><div class="bar"></div>
    <label class="control">云量 <input id="density" type="range" min="38" max="100" value="72" style="--range:#bfe8f5;--value:55%" aria-label="云量"></label>
    <label class="control sun-control">☀ <input id="sunlight" type="range" min="18" max="100" value="68" style="--range:#f3c36f;--value:61%" aria-label="日光强度"></label>
    <div class="bar"></div><label class="toggle-label"><span>自动旋转</span><button class="switch on" id="rotate" role="switch" aria-checked="true" aria-label="自动旋转"></button></label>
  </div></div>
  <div class="webgl-warning" id="warning">当前浏览器无法启用 WebGL 2，请尝试最新版浏览器。</div>
  <script>
  const CLOUDS=[
    {id:'cumulonimbus',type:0,name:'积雨云',latin:'Cumulonimbus',code:'Cb',icon:'ϟ',altitude:'0.5—16 km',weather:'雷暴 · 强降水',description:'一座向高空剧烈生长的云塔。底部厚重、顶部常展开成铁砧状，是大气中最具力量感的云。',formation:'暖湿空气快速上升，水汽凝结释放潜热，进一步强化对流，最终贯穿对流层。',accent:'#f4b15b'},
    {id:'stratocumulus',type:1,name:'层积云',latin:'Stratocumulus',code:'Sc',icon:'≋',altitude:'0.5—2 km',weather:'多云 · 偶有微雨',description:'成片铺展的低矮云团，彼此相连又保留圆润轮廓，常给天空铺上一层有节奏的灰白纹理。',formation:'近地层湿空气在逆温层下缓慢抬升，湍流把水汽聚成连续而起伏的云层。',accent:'#8cc8dd'},
    {id:'cirrus',type:2,name:'卷云',latin:'Cirrus',code:'Ci',icon:'⌁',altitude:'6—13 km',weather:'晴朗 · 天气将变',description:'高空中纤细透明的冰晶云，像被风梳开的羽毛。它们移动迅速，往往预示天气系统正在靠近。',formation:'高空水汽在零下几十摄氏度凝华成冰晶，并被高速气流拉伸成丝缕。',accent:'#a9c7ff'},
    {id:'cumulus',type:3,name:'积云',latin:'Cumulus',code:'Cu',icon:'☁',altitude:'0.5—2 km',weather:'晴好 · 局地对流',description:'边缘清晰、顶部像花椰菜般隆起的白云。它是阳光加热地表后，空气上升留下的可见痕迹。',formation:'地表受热产生小尺度上升气流，抵达凝结高度后形成底部平坦、顶部蓬松的云团。',accent:'#f7d89a'},
    {id:'stratus',type:4,name:'层云',latin:'Stratus',code:'St',icon:'━',altitude:'0—2 km',weather:'阴天 · 毛毛雨',description:'低空中均匀延展的灰色云幕，像抬离地面的雾。它弱化阳光，也让远处的轮廓变得柔和。',formation:'稳定湿润的空气缓慢冷却至饱和，形成薄而连续、垂直发展很弱的云层。',accent:'#b9c4c9'}
  ];
  let state={active:0,density:.72,sunlight:.68,rotate:true,yaw:-.12,pitch:-.04,zoom:1,drag:false,x:0,y:0};
  const list=document.querySelector('#cloud-list'),tabs=document.querySelector('#mobile-tabs'),card=document.querySelector('#card');
  function selectCloud(index){state.active=index;const c=CLOUDS[index];document.documentElement.style.setProperty('--accent',c.accent);document.querySelectorAll('[data-cloud]').forEach(b=>b.classList.toggle('active',+b.dataset.cloud===index));card.style.animation='none';void card.offsetWidth;card.style.animation='';card.innerHTML=`<div class="card-head"><div><p class="latin">${c.latin}</p><h2>${c.name}</h2></div><span class="code-badge">${c.code}</span></div><div class="facts"><div class="fact"><small>常见高度</small><span>${c.altitude}</span></div><div class="fact"><small>典型天气</small><span>${c.weather}</span></div></div><p class="description">${c.description}</p><div class="divider"></div><span class="formation-label">形成方式</span><p class="formation">${c.formation}</p>`}
  CLOUDS.forEach((c,i)=>{list.insertAdjacentHTML('beforeend',`<button class="cloud-btn" data-cloud="${i}"><span class="cloud-icon">${c.icon}</span><strong>${c.name}</strong><span class="cloud-code">${c.code}</span></button>`);tabs.insertAdjacentHTML('beforeend',`<button data-cloud="${i}">${c.name}</button>`)});document.addEventListener('click',e=>{const b=e.target.closest('[data-cloud]');if(b)selectCloud(+b.dataset.cloud)});selectCloud(0);
  document.querySelectorAll('input[type=range]').forEach(input=>input.addEventListener('input',e=>{const el=e.currentTarget,min=+el.min,max=+el.max,value=+el.value;el.style.setProperty('--value',`${(value-min)/(max-min)*100}%`);state[el.id]=value/100}));
  document.querySelector('#rotate').addEventListener('click',e=>{state.rotate=!state.rotate;e.currentTarget.classList.toggle('on',state.rotate);e.currentTarget.setAttribute('aria-checked',state.rotate)});

  const canvas=document.querySelector('#scene'),gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
  if(!gl){document.querySelector('#warning').classList.add('show')}else{
  const VS=`#version 300 es\nin vec2 aPosition;void main(){gl_Position=vec4(aPosition,0.,1.);}`;
  const FS=`#version 300 es
  precision highp float;out vec4 fragColor;uniform vec2 r;uniform float tm,ct,dn,sn,yw,pt,zm;uniform vec3 ac;
  float h(vec3 p){p=fract(p*.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}float n(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}float f(vec3 p){float v=0.,a=.55;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.03+vec3(7.1,3.7,5.2);a*=.5;}return v;}float sp(vec3 p,vec3 c,vec3 s){return 1.-length((p-c)/s);}
  float sh(vec3 p){float z=f(p*1.15+vec3(tm*.018,0,0)),q=f(p*2.75-vec3(tm*.026,0,0)),s=-1.;if(ct<.5){s=max(s,sp(p,vec3(-.25,-.65,0),vec3(1.8,.72,1.25)));s=max(s,sp(p,vec3(.22,.12,0),vec3(1.42,1.35,1.05)));s=max(s,sp(p,vec3(.02,1.22,0),vec3(1.12,1.25,.88)));s=max(s,sp(p,vec3(.18,2.05,0),vec3(1.75,.4,.92)));s+=(z-.47)*.72+(q-.5)*.18;}else if(ct<1.5){vec3 v=p;v.x=mod(v.x+1.15,2.3)-1.15;s=sp(v,vec3(0,-.12,0),vec3(1.32,.55,1.1));s=max(s,-abs(p.y+.18)+.36);s+=(z-.54)*.88+(q-.5)*.12;}else if(ct<2.5){vec3 v=p;v.x+=v.y*1.25+sin(v.z*1.8)*.2;float st=sin(v.x*2.8+f(v*1.7)*4.)*.5+.5;s=.18-abs(v.y-.85-sin(v.x*.55)*.18)+(st-.72)*.36-abs(v.z)*.08+(z-.53)*.28;}else if(ct<3.5){s=max(s,sp(p,vec3(-.75,-.3,0),vec3(1,.7,.9)));s=max(s,sp(p,vec3(.2,-.1,0),vec3(1.25,.95,1.05)));s=max(s,sp(p,vec3(.9,-.28,.05),vec3(.86,.62,.76)));s=min(s,p.y+.83)+(z-.5)*.68+(q-.5)*.16;}else{s=.3-abs(p.y+.12+(z-.5)*.22)-max(abs(p.z)-1.8,0.)*.3+(q-.52)*.18;}return max(s*1.8+(dn-.58)*.42,0.);}mat2 R(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
  void main(){vec2 p=(gl_FragCoord.xy*2.-r)/r.y;vec3 sky=mix(vec3(.24,.48,.61),vec3(.025,.14,.24),smoothstep(-.75,.82,p.y));float sd=pow(max(dot(normalize(vec3(p,1.4)),normalize(vec3(-.35,.55,1))),0.),420.);sky+=vec3(1,.66,.3)*sd*sn*.8;vec3 ro=vec3(0,.32,5.5*zm),rd=normalize(vec3(p,-1.7));ro.xz=R(yw)*ro.xz;rd.xz=R(yw)*rd.xz;ro.yz=R(pt)*ro.yz;rd.yz=R(pt)*rd.yz;vec3 ld=normalize(vec3(-.8,.85,.5)),col=sky;float tr=1.,sl=(9.2-2.3)/42.;for(int i=0;i<42;i++){float d=2.3+(float(i)+h(vec3(gl_FragCoord.xy,float(i)))*.7)*sl;vec3 x=ro+rd*d;x.z*=.86;float de=sh(x)*.19;if(de>.002){float dl=sh(x+ld*.2),di=clamp((de-dl)*2.8+.48,.12,1.),sv=pow(max(dot(rd,ld),0.),8.)*.45;vec3 cs=mix(vec3(.19,.28,.34),vec3(.98,.98,.92),di*sn);cs=mix(cs,ac,.05+sv*.08);float al=1.-exp(-de*sl*5.);col+=tr*cs*al;tr*=1.-al;if(tr<.025)break;}}float hz=smoothstep(-.36,-.08,p.y)*(1.-smoothstep(-.08,.08,p.y));col+=vec3(.48,.63,.67)*hz*.08;col=pow(col,vec3(.9));col*=1.-dot(p,p)*.08;fragColor=vec4(col,1);}`;
  function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,VS));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(prog));const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const pos=gl.getAttribLocation(prog,'aPosition');gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,2,gl.FLOAT,false,0,0);const U={r:gl.getUniformLocation(prog,'r'),tm:gl.getUniformLocation(prog,'tm'),ct:gl.getUniformLocation(prog,'ct'),dn:gl.getUniformLocation(prog,'dn'),sn:gl.getUniformLocation(prog,'sn'),yw:gl.getUniformLocation(prog,'yw'),pt:gl.getUniformLocation(prog,'pt'),zm:gl.getUniformLocation(prog,'zm'),ac:gl.getUniformLocation(prog,'ac')};const start=performance.now();
  function render(now){const dpr=Math.min(devicePixelRatio||1,1.5),w=Math.floor(canvas.clientWidth*dpr),hgt=Math.floor(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==hgt){canvas.width=w;canvas.height=hgt;gl.viewport(0,0,w,hgt)}if(state.rotate&&!state.drag)state.yaw+=.00035;const c=CLOUDS[state.active],v=c.accent.slice(1).match(/.{2}/g).map(x=>parseInt(x,16)/255);gl.useProgram(prog);gl.uniform2f(U.r,w,hgt);gl.uniform1f(U.tm,(now-start)/1000);gl.uniform1f(U.ct,c.type);gl.uniform1f(U.dn,state.density);gl.uniform1f(U.sn,state.sunlight);gl.uniform1f(U.yw,state.yaw);gl.uniform1f(U.pt,state.pitch);gl.uniform1f(U.zm,state.zoom);gl.uniform3f(U.ac,...v);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(render)}requestAnimationFrame(render);
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);Object.assign(state,{drag:true,x:e.clientX,y:e.clientY})});canvas.addEventListener('pointermove',e=>{if(!state.drag)return;state.yaw+=(e.clientX-state.x)*.004;state.pitch=Math.max(-.48,Math.min(.42,state.pitch+(e.clientY-state.y)*.0025));state.x=e.clientX;state.y=e.clientY});['pointerup','pointercancel'].forEach(x=>canvas.addEventListener(x,()=>state.drag=false));canvas.addEventListener('wheel',e=>{state.zoom=Math.max(.72,Math.min(1.34,state.zoom+e.deltaY*.0008))},{passive:true});
  }
  </script>
</body>
</html>
